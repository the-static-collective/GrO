name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run demo

  tenet-002-relatte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/reLATTE
          ref: 87006f3265103a8abe387d81597c58aeb39b0beb
          path: .deps/reLATTE
      - run: npm install --prefix .deps/reLATTE --no-audit --no-fund
      - run: node --experimental-strip-types examples/tenet-002-relatte.mjs .deps/reLATTE
