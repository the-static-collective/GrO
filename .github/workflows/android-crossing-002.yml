name: GrO Android Crossing 002

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-crossing-002.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-crossing-002.yml"

permissions:
  contents: read

jobs:
  android:
    name: Build phone-native GrO crossing companion
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Compile debug APK and run JVM verifier checks
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - name: Prove APK was built
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gro-crossing-002-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
