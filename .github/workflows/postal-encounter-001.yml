name: GrO local postal encounter
on:
  pull_request:
    paths:
      - 'src/postal-encounter.js'
      - 'test/postal-encounter.test.js'
      - 'docs/POSTAL-ENCOUNTER-001.md'
      - '.github/workflows/postal-encounter-001.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
